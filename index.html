<!DOCTYPE html>
<html>
<head>
<title>Nexora AI</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
margin:0;
background:#fff;
color:#202124;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
padding:20px;
background:#f8f9fb;
border-right:1px solid #ddd;
}

.new{
width:100%;
padding:15px;
border-radius:18px;
border:1px solid #ddd;
background:#fff;
font-weight:bold;
cursor:pointer;
}

.menu{
margin-top:25px;
}

.menu button{
width:100%;
padding:13px;
margin:5px 0;
border:0;
background:transparent;
border-radius:14px;
text-align:left;
font-size:15px;
cursor:pointer;
}

.menu button:hover{
background:#e8eefc;
}

.main{
margin-left:250px;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
height:80px;
display:flex;
align-items:center;
gap:15px;
padding:15px 25px;
}

.logo{
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
background:linear-gradient(135deg,#4285f4,#9333ea,#22c55e);
box-shadow:0 0 20px #9333ea;
animation:spin 3s infinite;
}

@keyframes spin{
50%{transform:rotate(180deg)}
}

.title{
font-size:36px;
font-weight:800;
background:linear-gradient(90deg,#4285f4,#9333ea);
-webkit-background-clip:text;
color:transparent;
}

.chat{
flex:1;
min-height:0;
}

iframe{
width:100%;
height:100%;
border:0;
display:block;
}

@media(max-width:700px){

.sidebar{
width:75px;
padding:10px;
}

.menu button,.new{
font-size:0;
}

.main{
margin-left:75px;
}

.title{
font-size:24px;
}

.logo{
width:45px;
height:45px;
}

}
</style>
</head>

<body>

<div class="sidebar">

<button class="new">
＋ New Chat
</button>

<div class="menu">

<button>🖼️ Images</button>
<button>📚 Library</button>
<button>💻 CodeX</button>
<button>📁 Projects</button>
<button>⭐ More</button>
<button>⚙️ Settings</button>

</div>

</div>


<div class="main">

<div class="header">

<div class="logo">✦</div>

<div class="title">
Nexora AI
</div>

</div>


<div class="chat">

<iframe src="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/08/03/00/20260803003137-LERHAVNS.json">
</iframe>

</div>

</div>

</body>
</html>
