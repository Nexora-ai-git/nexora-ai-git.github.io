<!DOCTYPE html>
<html>
<head>
<title>Nexora AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ffffff,#eef2ff);
    color:#202124;
}


.container {
    max-width:850px;
    margin:auto;
    padding:30px;
}


/* Animated Logo */

.brand {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin-top:20px;
}


.ai-logo {
    width:75px;
    height:75px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    color:white;
    background:linear-gradient(135deg,#4285f4,#9333ea);
    box-shadow:0 0 35px #4285f4;
    animation:float 2s infinite ease-in-out;
}


@keyframes float {

    0%,100% {
        transform:translateY(0);
    }

    50% {
        transform:translateY(-12px);
    }

}


.brand-name {

    font-size:45px;
    font-weight:700;
    background:linear-gradient(90deg,#4285f4,#9333ea);
    -webkit-background-clip:text;
    color:transparent;

}


.tagline {

    text-align:center;
    color:#666;
    font-size:18px;
    margin-top:10px;

}


/* Chat */

.chatbox {

    margin-top:40px;
    height:430px;
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 30px #0002;
    overflow-y:auto;

}


.message {

    padding:14px 18px;
    margin:12px 0;
    border-radius:20px;
    max-width:75%;
    line-height:1.4;

}


.ai {

    background:#f1f3f4;

}


.user {

    background:#dbeafe;
    margin-left:auto;
    text-align:right;

}


/* Input */

.input-area {

    display:flex;
    margin-top:20px;

}


input {

    flex:1;
    padding:18px;
    border-radius:30px;
    border:1px solid #ddd;
    font-size:16px;
    outline:none;

}


button {

    margin-left:10px;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:#4285f4;
    color:white;
    font-size:22px;
    cursor:pointer;

}


button:hover {

    transform:scale(1.05);

}


@media(max-width:600px){

.brand-name{
    font-size:35px;
}

.ai-logo{
    width:60px;
    height:60px;
}

.container{
    padding:15px;
}

}


</style>

</head>


<body>


<div class="container">


<div class="brand">

<div class="ai-logo">
✦
</div>

<div class="brand-name">
Nexora AI
</div>

</div>


<p class="tagline">
Your intelligent AI assistant
</p>



<div class="chatbox" id="chat">


<div class="message ai">
Hello 👋 I am Nexora AI.<br>
How can I help you today?
</div>


</div>



<div class="input-area">

<input id="input" placeholder="Ask Nexora anything...">

<button onclick="send()">➤</button>

</div>



</div>



<script>


function send(){


let input=document.getElementById("input");
let chat=document.getElementById("chat");


let text=input.value.trim();


if(text=="") return;



chat.innerHTML +=
"<div class='message user'>"+text+"</div>";



let typing=document.createElement("div");

typing.className="message ai";

typing.innerHTML="Nexora is thinking... 🤖";

chat.appendChild(typing);



setTimeout(()=>{


typing.innerHTML=
"Thanks for asking! I am Nexora AI demo. My intelligence is growing 🚀";


chat.scrollTop=chat.scrollHeight;


},1000);



input.value="";


}


</script>


</body>
</html>
