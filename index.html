<!DOCTYPE html>
<html>
<head>
<title>Nexora AI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 30px;
}

h1 {
    text-align: center;
    font-size: 45px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
}

.chatbox {
    background: #1e293b;
    height: 400px;
    border-radius: 15px;
    padding: 20px;
    overflow-y: auto;
    margin-top: 30px;
}

.message {
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
}

.user {
    background: #2563eb;
    text-align: right;
}

.ai {
    background: #334155;
}

.input-area {
    display: flex;
    margin-top: 15px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    border: none;
}

button {
    margin-left: 10px;
    padding: 15px 25px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    cursor: pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>🤖 Nexora AI</h1>

<p class="subtitle">
Your intelligent AI assistant
</p>


<div class="chatbox" id="chat">

<div class="message ai">
Hello! I am Nexora AI. How can I help you?
</div>

</div>


<div class="input-area">

<input id="input" placeholder="Ask something...">

<button onclick="send()">Send</button>

</div>


</div>


<script>

function send(){

let input=document.getElementById("input");
let chat=document.getElementById("chat");

let text=input.value;

if(text=="") return;


chat.innerHTML += 
'<div class="message user">'+text+'</div>';


setTimeout(()=>{

chat.innerHTML +=
'<div class="message ai">I am Nexora AI demo. My real AI brain will be connected soon 🚀</div>';

chat.scrollTop=chat.scrollHeight;

},700);


input.value="";

}

</script>


</body>
</html>    <button>
        Chat with Nexora AI
    </button>

</body>
</html>
