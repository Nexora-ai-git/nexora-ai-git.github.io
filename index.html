<!DOCTYPE html>
<html>
<head>
<title>Nexora AI</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff;color:#202124;transition:.3s}

.sidebar{
position:fixed;
width:250px;
height:100vh;
padding:18px;
background:#f8f9fa;
border-right:1px solid #ddd
}

.newchat{
width:100%;
padding:14px;
border-radius:20px;
border:1px solid #ddd;
background:white;
font-weight:bold;
cursor:pointer
}

.menu{margin-top:25px}

.menu button{
width:100%;
padding:12px;
margin:5px 0;
border:0;
background:none;
text-align:left;
border-radius:12px;
cursor:pointer
}

.menu button:hover{background:#e8eaed}

.main{
margin-left:250px;
height:100vh;
display:flex;
flex-direction:column
}

.header{
height:80px;
display:flex;
align-items:center;
gap:15px;
padding:15px
}

.logo{
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
background:linear-gradient(135deg,#4285f4,#9333ea,#22c55e);
animation:logo 3s infinite;
box-shadow:0 0 20px #9333ea
}

@keyframes logo{
50%{transform:translateY(-5px) rotate(180deg)}
}

.title{
font-size:36px;
font-weight:800;
background:linear-gradient(90deg,#4285f4,#9333ea,#22c55e);
-webkit-background-clip:text;
color:transparent
}

.welcome{
text-align:center;
padding:10px
}

.welcome h1{
font-size:38px;
margin:10px
}

.welcome p{
color:#666;
font-size:17px
}

.quick button{
padding:12px 18px;
margin:5px;
border-radius:18px;
border:1px solid #ddd;
background:white;
cursor:pointer
}

#chat{
flex:1;
overflow:hidden
}

iframe{
width:100%;
height:100%;
border:0
}

#settings{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 40px #999;
z-index:10
}

#settings button{
padding:12px;
border-radius:15px;
border:1px solid #ddd;
cursor:pointer
}

.dark{
background:#202124;
color:white
}

.dark .sidebar{
background:#171717;
border-color:#333
}

.dark .newchat,
.dark #settings,
.dark .quick button{
background:#303134;
color:white
}

.dark .menu button{color:white}

</style>
</head>

<body>

<div class="sidebar">

<button class="newchat" onclick="location.reload()">＋ New Chat</button>

<div class="menu">
<button>🖼️ Images</button>
<button>📚 Library</button>
<button>💻 CodeX</button>
<button>📁 Projects</button>
<button>⭐ Favorites</button>
<button>🕘 History</button>
<button>⋯ More</button>
<button onclick="openSettings()">⚙️ Settings</button>
</div>

</div>


<div class="main">

<div class="header">
<div class="logo">✦</div>
<div class="title">Nexora AI</div>
</div>


<div class="welcome">
<h1>Hi there 👋</h1>
<p>
How can Nexora help you today?<br>
Tap a starting point or ask in your own words.
</p>

<div class="quick">
<button>✍️ Write</button>
<button>💡 Ideas</button>
<button>💻 Code</button>
<button>📚 Learn</button>
</div>
</div>


<div id="chat">
<iframe src="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/08/03/00/20260803003137-LERHAVNS.json"></iframe>
</div>

</div>


<div id="settings">

<h2>Settings</h2>

<button onclick="darkMode()">🌙 Dark Mode</button>
<br><br>
<button onclick="lightMode()">☀️ Light Mode</button>
<br><br>
<button onclick="closeSettings()">Close</button>

</div>


<script>

function openSettings(){
document.getElementById("settings").style.display="block";
}

function closeSettings(){
document.getElementById("settings").style.display="none";
}

function darkMode(){
document.body.classList.add("dark");
}

function lightMode(){
document.body.classList.remove("dark");
}

</script>

</body>
</html>
