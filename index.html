<!DOCTYPE html>
<html>
<head>

<title>Nexora AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#ffffff;
color:#202124;
transition:.3s;
}


/* SIDEBAR */

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
background:#f8f9fa;
border-right:1px solid #ddd;
padding:20px;
}


.newchat{
width:100%;
padding:14px;
border-radius:20px;
border:1px solid #ddd;
background:white;
font-size:16px;
cursor:pointer;
}


.menu{
margin-top:25px;
}


.menu button{

width:100%;
padding:13px;

margin:6px 0;

border:0;

background:transparent;

text-align:left;

font-size:16px;

border-radius:12px;

cursor:pointer;

}


.menu button:hover{
background:#e8eaed;
}



/* MAIN */

.main{
margin-left:250px;
height:100vh;
display:flex;
flex-direction:column;
}



.header{

height:80px;

display:flex;

align-items:center;

gap:15px;

padding:20px;

}



.logo{

width:55px;

height:55px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

color:white;

background:linear-gradient(135deg,#4285f4,#9333ea,#22c55e);

animation:spin 4s linear infinite;

}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}




.title{

font-size:34px;

font-weight:700;

letter-spacing:-1px;

background:linear-gradient(90deg,#4285f4,#9333ea,#22c55e);

-webkit-background-clip:text;

color:transparent;

}



/* BOTPRESS */

#webchat-container{

width:100%;

height:calc(100vh - 80px);

}


iframe{

width:100%;

height:100%;

border:0;

}



/* SETTINGS */

#settings{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 0 20px #999;

z-index:99;

}


#settings button{

padding:12px;

border-radius:15px;

border:1px solid #ddd;

background:white;

cursor:pointer;

}



/* DARK */

.dark{

background:#202124;

color:white;

}


.dark .sidebar{

background:#171717;

border-color:#333;

}


.dark .newchat,
.dark #settings{

background:#303134;

color:white;

}


</style>

</head>


<body>



<div class="sidebar">


<button class="newchat" onclick="newChat()">
＋ New Chat
</button>



<div class="menu">


<button>
🖼️ Images
</button>


<button>
📚 Library
</button>


<button>
💻 CodeX
</button>


<button>
📁 Projects
</button>


<button>
⋯ More
</button>


<button onclick="openSettings()">
⚙️ Settings
</button>


</div>


</div>





<div class="main">


<div class="header">


<div class="logo">
✦
</div>


<div class="title">
Nexora AI
</div>


</div>



<div id="webchat-container">


<iframe src="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/08/03/00/20260803003137-LERHAVNS.json">
</iframe>


</div>



</div>






<div id="settings">


<h2>
Settings
</h2>


<button onclick="lightMode()">
☀️ Light Mode
</button>


<br><br>


<button onclick="darkMode()">
🌙 Dark Mode
</button>


<br><br>


<button onclick="closeSettings()">
Close
</button>


</div>






<script>


function newChat(){

location.reload();

}



function openSettings(){

document.getElementById("settings").style.display="block";

}


function closeSettings(){

document.getElementById("settings").style.display="none";

}



function darkMode(){

document.body.classList.add("dark");

}



function lightMode(){

document.body.classList.remove("dark");

}


</script>



</body>
</html>
