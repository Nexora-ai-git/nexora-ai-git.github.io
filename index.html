<!DOCTYPE html>
<html>
<head>

<title>Nexora AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#ffffff;
overflow:hidden;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:240px;
height:100vh;
background:#f8f9fa;
border-right:1px solid #ddd;
padding:20px;
}

.newchat{
width:100%;
padding:15px;
border-radius:20px;
background:white;
border:1px solid #ddd;
font-size:16px;
}

.menu{
margin-top:30px;
line-height:3;
color:#555;
}


.main{
margin-left:240px;
height:100vh;
}


.header{

height:70px;
padding:20px;
font-size:32px;
font-weight:bold;

background:linear-gradient(90deg,#4285f4,#9333ea);
-webkit-background-clip:text;
color:transparent;

}


#botpress{

height:calc(100vh - 70px);
width:100%;

}


iframe{

width:100%;
height:100%;
border:0;

}


@media(max-width:700px){

.sidebar{
display:none;
}

.main{
margin-left:0;
}

}

</style>

</head>


<body>


<div class="sidebar">

<button class="newchat">
＋ New Chat
</button>


<div class="menu">

🖼️ Images

<br>

📚 Library

<br>

⚙️ Settings

</div>

</div>



<div class="main">

<div class="header">
Nexora AI
</div>


<div id="botpress">

<iframe src="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/08/03/00/20260803003137-LERHAVNS.json">
</iframe>

</div>


</div>


</body>
</html>
