<!DOCTYPE html>
<html>
<head>
<title>Nexora AI</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif
}

body{
margin:0;
background:white;
color:#202124;
overflow:hidden
}

.sidebar{
position:fixed;
left:0;
top:0;
width:120px;
height:100vh;
padding:6px;
background:#f8f9fa;
border-right:1px solid #ddd
}

.new{
width:90px;
height:32px;
border-radius:12px;
border:1px solid #ddd;
background:white;
font-size:11px;
font-weight:bold;
white-space:nowrap;
cursor:pointer
}

.menu{
margin-top:15px
}

.menu button{
width:90px;
height:32px;
margin:4px 0;
border:0;
background:transparent;
border-radius:10px;
font-size:11px;
text-align:left;
cursor:pointer;
white-space:nowrap
}

.menu button:hover{
background:#e8eaed
}

.main{
margin-left:120px;
height:100vh;
display:flex;
flex-direction:column
}

.header{
height:65px;
display:flex;
align-items:center;
gap:10px;
padding:10px
}

.logo{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
color:white;
background:linear-gradient(135deg,#4285f4,#9333ea,#22c55e)
}

.title{
font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#4285f4,#9333ea);
-webkit-background-clip:text;
color:transparent
}

.chat{
flex:1;
min-height:0
}

iframe{
width:100%;
height:100%;
border:0
}
</style>

</head>

<body>

<div class="sidebar">

<button class="new">＋ New Chat</button>

<div class="menu">
<button>🖼️ Images</button>
<button>📚 Library</button>
<button>💻 CodeX</button>
<button>📁 Projects</button>
<button>⭐ More</button>
<button>⚙️ Settings</button>
</div>

</div>


<div class="main">

<div class="header">
<div class="logo">✦</div>
<div class="title">Nexora AI</div>
</div>

<div class="chat">
<iframe src="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/08/03/00/20260803003137-LERHAVNS.json"></iframe>
</div>

</div>

</body>
</html>
